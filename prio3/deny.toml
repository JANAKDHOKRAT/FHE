# cargo-deny policy shared by every crate under prio3/ (each crate is its
# own workspace, so CI runs `cargo deny --manifest-path <crate>/Cargo.toml
# --config prio3/deny.toml check`). Four checks:
#   advisories  RustSec advisories against every dependency in the lockfile
#   licenses    every dependency's license must be on the allow list
#   bans        duplicate versions are reported, wildcard versions refused
#   sources     crates come from crates.io or this repository only
# A finding fails CI. There are no ignores: an advisory is fixed by an
# upgrade, and a new license is added here after reading it.

[graph]
all-features = false
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only. Every entry below appears in the current
# dependency graphs of the three crates (listed with `cargo metadata`).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
