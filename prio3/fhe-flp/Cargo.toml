[package]
name = "fhe-flp"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Prio3's fully linear proofs (FLP) checked under threshold BGV: one coefficient-encoded ciphertext per report, linear queries evaluated homomorphically, only the verifier message and the aggregate decrypted"

# standalone: not part of the parent workspace (like fhe-prio3)
[workspace]

[dependencies]
prio = "=0.18.1"
openfhe-tbgv-rs = { path = "../openfhe-tbgv-rs" }
sha2 = "0.10"
rand = "0.8"
# prio 0.18.1's seed streams implement this version's `Rng` (PINE reads raw stream bytes)
rand_core = "0.10"
# the same versions prio 0.18.1 uses, for the traits Field65537 implements
serde = "1"
subtle = "2.6"

[dev-dependencies]
serde_json = "1"
# the PINE circuits written separately from the same reference (tests/pine_upstream.rs)
pine-circuit = { path = "../../pine-bgv-port/port/pine-circuit" }

[profile.release]
debug = false

[profile.test]
opt-level = 3
