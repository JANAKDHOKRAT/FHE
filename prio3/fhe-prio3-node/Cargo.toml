[package]
name = "fhe-prio3-node"
version = "0.1.0"
edition = "2024"
description = "Network nodes (aggregator, collector, client) for fhe-prio3 with TLS transport and SQLite persistence"
license = "MIT"

[dependencies]
fhe-prio3 = { path = "../fhe-prio3" }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
hex = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "fs"] }
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
aes-gcm = "0.10"
rand = "0.8"
anyhow = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[workspace]

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
