[package]
name = "prio3-baseline"
version = "0.1.0"
edition = "2024"
description = "Prio3 (VDAF) baseline measurements with the reference Rust implementation, for comparison with fhe-prio3"
license = "MIT OR Apache-2.0"
publish = false

# standalone: not part of the parent workspace
[workspace]

[dependencies]
prio = "=0.18.1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
debug = false
